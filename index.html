<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Order form</title>
    <link rel="stylesheet" href="style.css">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    
</head>

<body >
    <div class="container mt-4">
    <h1 class="text-center fw-bold mb-4">Welcome to Our Restaurant</h1>
    
    <div class="row" oninput="placeOrder()">
        <div class="col-md-7">
            <table class="table table-bordered shadow-sm">
                <tr class="table-primary">
                    <td colspan="2" class="text-center fw-bolder">Customer Details</td>
                </tr>
                <tr>
                    <td class="fw-bold">Customer Name</td>
                    <td><input type="text" class="form-control" id="txtName" placeholder="Enter name"></td>
                </tr>
                <tr>
                    <td class="fw-bold">Mobile</td>
                    <td><input type="text" class="form-control" id="txtMobile" placeholder="Enter mobile number"></td>
                </tr>
            </table>

            <h5 class="fw-bold mt-4">Select a Meal</h5>
            <div class="row text-center">
                <div class="col-md-4">
                    <div class="form-check p-0">
                        <img src="burger.jpeg" class="img-thumbnail mb-2" width="100" height="100">
                        <br>
                        <input class="form-check-input float-none" type="radio" name="meal" id="optBurger" value="Burger">
                        <label class="form-check-label fw-bold" for="optBurger">Burger (৳120)</label>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-check p-0">
                        <img src="Spring Roll.jpeg" class="img-thumbnail mb-2" width="100" height="100">
                        <br>
                        <input class="form-check-input float-none" type="radio" name="meal" id="optSproll" value="Spring Roll">
                        <label class="form-check-label fw-bold" for="optSproll">Roll (৳80)</label>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-check p-0">
                        <img src="fries.jpeg" class="img-thumbnail mb-2" width="100" height="100">
                        <br>
                        <input class="form-check-input float-none" type="radio" name="meal" id="optfries" value="Fries">
                        <label class="form-check-label fw-bold" for="optfries">Fries (৳50)</label>
                    </div>
                </div>
            </div>

            <h5 class="fw-bold mt-4">Select Add-ons</h5>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-check d-flex align-items-center gap-3">
                        <input class="form-check-input" type="checkbox" id="optcoke" value="Coke">
                        <label class="form-check-label fw-bold" for="optcoke">Coke (৳30)</label>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-check d-flex align-items-center gap-3">
                        <input class="form-check-input" type="checkbox" id="optmirinda" value="Mirinda">
                        <label class="form-check-label fw-bold" for="optmirinda">Mirinda (৳30)</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-5">
            <div id="orderSummary" class="p-4 border rounded bg-white shadow" style="display: none;">
                <h2 class="text-center border-bottom pb-2">Receipt</h2>
                <dl class="row">
                    <dt class="col-sm-5">Customer:</dt>
                    <dd class="col-sm-7" id="lblName">---</dd>

                    <dt class="col-sm-5">Mobile:</dt>
                    <dd class="col-sm-7" id="lblMobile">---</dd>

                    <dt class="col-sm-5">Meal:</dt>
                    <dd class="col-sm-7" id="lblMeal">---</dd>

                    <dt class="col-sm-5">Add-ons:</dt>
                    <dd class="col-sm-7" id="lblAdd">None</dd>
                </dl>
                <hr>
                <div class="d-flex justify-content-between">
                    <span>Subtotal:</span>
                    <span id="lblSubtotal">৳0</span>
                </div>
                <div class="d-flex justify-content-between text-muted small">
                    <span>VAT (5%):</span>
                    <span id="lblTax">৳0</span>
                </div>
                <div class="d-flex justify-content-between fw-bold fs-4 mt-2 text-danger">
                    <span>Total:</span>
                    <span id="lblAmount">৳0</span>
                </div>
                <button class="btn btn-secondary w-100 mt-3" id="btnPrint" onclick="window.print()" disabled>Print Bill</button>
            </div>
        </div>
    </div>
</div>

<script src="index.js"></script>
    
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
 
</body>
</html>
