<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Order form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container mt-4">
        <h1 class="text-center fw-bold mb-4">Welcome to Our Restaurant</h1>

        <div class="row" oninput="placeOrder()">
            
            <div class="col-md-7">
                <table class="table table-bordered shadow-sm">
                    <tr class="table-primary">
                        <td colspan="2" class="text-center fw-bolder">Customer Details</td>
                    </tr>
                    <tr>
                        <td class="fw-bold">Customer Name</td>
                        <td><input type="text" class="form-control" id="txtName" placeholder="Enter name"></td>
                    </tr>
                    <tr>
                        <td class="fw-bold">Mobile</td>
                        <td><input type="text" class="form-control" id="txtMobile" placeholder="Enter mobile number"></td>
                    </tr>
                </table>

                <h5 class="fw-bold mt-4">Select Meals</h5>
                <div class="row text-center">
                    <div class="col-md-4 mb-3">
                        <div class="form-check p-2 border rounded bg-white item-card">
                            <input class="form-check-input" type="checkbox" id="optBurger">
                            <label class="form-check-label fw-bold d-block" for="optBurger">Burger (৳120)</label>
                            <input type="number" id="qtyBurger" class="form-control form-control-sm mt-1 mx-auto" value="1" min="1" style="width: 70px;">
                        </div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <div class="form-check p-2 border rounded bg-white item-card">
                            <input class="form-check-input" type="checkbox" id="optSproll">
                            <label class="form-check-label fw-bold d-block" for="optSproll">Roll (৳80)</label>
                            <input type="number" id="qtySproll" class="form-control form-control-sm mt-1 mx-auto" value="1" min="1" style="width: 70px;">
                        </div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <div class="form-check p-2 border rounded bg-white item-card">
                            <input class="form-check-input" type="checkbox" id="optfries">
                            <label class="form-check-label fw-bold d-block" for="optfries">Fries (৳50)</label>
                            <input type="number" id="qtyfries" class="form-control form-control-sm mt-1 mx-auto" value="1" min="1" style="width: 70px;">
                        </div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <div class="form-check p-2 border rounded bg-white item-card">
                            <input class="form-check-input" type="checkbox" id="optPizza">
                            <label class="form-check-label fw-bold d-block" for="optPizza">Pizza (৳450)</label>
                            <input type="number" id="qtyPizza" class="form-control form-control-sm mt-1 mx-auto" value="1" min="1" style="width: 70px;">
                        </div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <div class="form-check p-2 border rounded bg-white item-card">
                            <input class="form-check-input" type="checkbox" id="optPasta">
                            <label class="form-check-label fw-bold d-block" for="optPasta">Pasta (৳220)</label>
                            <input type="number" id="qtyPasta" class="form-control form-control-sm mt-1 mx-auto" value="1" min="1" style="width: 70px;">
                        </div>
                    </div>
                </div>

                <h5 class="fw-bold mt-4">Select Add-ons</h5>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <div class="form-check d-flex align-items-center justify-content-between border p-2 rounded bg-white item-card">
                            <div>
                                <input class="form-check-input ms-1" type="checkbox" id="optcoke">
                                <label class="form-check-label fw-bold ms-4" for="optcoke">Coke (৳30)</label>
                            </div>
                            <input type="number" id="qtycoke" class="form-control form-control-sm" value="1" min="1" style="width: 65px;">
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <div class="form-check d-flex align-items-center justify-content-between border p-2 rounded bg-white item-card">
                            <div>
                                <input class="form-check-input ms-1" type="checkbox" id="optmirinda">
                                <label class="form-check-label fw-bold ms-4" for="optmirinda">Mirinda (৳30)</label>
                            </div>
                            <input type="number" id="qtymirinda" class="form-control form-control-sm" value="1" min="1" style="width: 65px;">
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <div class="form-check d-flex align-items-center justify-content-between border p-2 rounded bg-white item-card">
                            <div>
                                <input class="form-check-input ms-1" type="checkbox" id="optCoffee">
                                <label class="form-check-label fw-bold ms-4" for="optCoffee">Coffee (৳60)</label>
                            </div>
                            <input type="number" id="qtyCoffee" class="form-control form-control-sm" value="1" min="1" style="width: 65px;">
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <div class="form-check d-flex align-items-center justify-content-between border p-2 rounded bg-white item-card">
                            <div>
                                <input class="form-check-input ms-1" type="checkbox" id="optBrownie">
                                <label class="form-check-label fw-bold ms-4" for="optBrownie">Brownie (৳90)</label>
                            </div>
                            <input type="number" id="qtyBrownie" class="form-control form-control-sm" value="1" min="1" style="width: 65px;">
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-5">
                <div id="orderSummary" class="p-4 border rounded bg-white shadow sticky-top" style="display: none; top: 20px;">
                    <h2 class="text-center border-bottom pb-2">Receipt</h2>
                    <dl class="row mb-0">
                        <dt class="col-sm-5">Customer:</dt>
                        <dd class="col-sm-7" id="lblName">---</dd>

                        <dt class="col-sm-5">Mobile:</dt>
                        <dd class="col-sm-7" id="lblMobile">---</dd>

                        <dt class="col-sm-12">Items Ordered:</dt>
                        <dd class="col-sm-12" id="lblMeal">
                            <div class="text-muted small">No items selected</div>
                        </dd>
                    </dl>
                    <hr>
                    <div class="d-flex justify-content-between">
                        <span>Subtotal:</span>
                        <span id="lblSubtotal">৳0</span>
                    </div>
                    <div class="d-flex justify-content-between text-muted small">
                        <span>VAT (5%):</span>
                        <span id="lblTax">৳0</span>
                    </div>
                    <div class="d-flex justify-content-between fw-bold fs-4 mt-2 text-danger border-top pt-2">
                        <span>Total:</span>
                        <span id="lblAmount">৳0</span>
                    </div>
                    <button class="btn btn-secondary w-100 mt-3 fw-bold" id="btnPrint" onclick="window.print()" disabled>Print Bill</button>
                    <button class="btn btn-outline-danger btn-sm w-100 mt-2" onclick="location.reload()">Reset Order</button>
                </div>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
